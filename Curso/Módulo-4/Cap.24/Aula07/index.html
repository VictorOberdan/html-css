<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.java" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="nome" autocomplete="name" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel"  pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxxx-xxxx">
            </p>
        </fieldset>
        <!--ppattern="^\d{4}-\d{4}$" utilizar para telefone fixo-->
        <!--pattern="^\d{4,5}-\d{4}$" utilizar para celular (5 digitos)-->
        <!--pattern="^\(\d{2}\)\d{4,5}-\d{4}$" utilizar para informar ddd mais o número com 5 digitos-->
        <!-- Estudar mais sobre RegEx (Expressões regulares) -->
        <!-- O mais adequado definir o controle por meio de javascript ou outra linguagem de programação -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
